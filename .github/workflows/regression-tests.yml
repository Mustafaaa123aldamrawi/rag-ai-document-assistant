name: Regression Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-docx fastapi pydantic pypdf python-multipart PyMuPDF Pillow requests PyJWT cryptography SQLAlchemy boto3

      - name: Compile production modules
        run: |
          python -m py_compile api/main.py api/runtime_config.py artifact_store.py project_store.py cloud_store.py drawing_qa.py drawing_visual.py project_engineer.py project_plan.py project_dashboard.py professional_reports.py report_export.py api/auth_context.py

      - name: Run regression tests
        run: |
          pytest tests -v

  mobile-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck
