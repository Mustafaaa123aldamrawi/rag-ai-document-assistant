name: Regression Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  regression-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-docx fastapi pydantic pypdf python-multipart

      - name: Compile production modules
        run: |
          python -m py_compile api/main.py project_store.py drawing_qa.py project_engineer.py

      - name: Run regression tests
        run: |
          pytest tests -v
